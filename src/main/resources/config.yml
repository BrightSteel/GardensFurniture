# Items with special behaviour, by their id in items/*.yml.
# Change these if you rename one of these items; missing keys fall back to the defaults shown here.
special_items:
  # right-click opens the dye menu
  paint_bench: paint_bench
  # colour swatch shown in the dye menu
  dye_tile: dye_tile
  # right-click deletes an entity or furniture piece (needs gardens.destroy_stick)
  destroy_stick: destroy_stick
  # items whose id starts with this teleport players up (jump) or down (sneak) to the next pad
  ender_pad_prefix: ender_pad
  # <prefix>_1 to <prefix>_5 are the growth stages of a maple tap
  maple_tap_prefix: maple_tap
  # given for emptying a full maple tap with a glass bottle
  maple_syrup: maple_syrup
  # hidden block placed on top of tall tripwire furniture
  tripwire_top: tripwire_top
  # <prefix> and <prefix>_<color> are crafted from (dyed) shulker boxes
  backpack_prefix: backpack

# World-gen furniture: marker note blocks in newly generated chunks are swapped for furniture on the main thread,
# for a slice of each tick (milliseconds, of a tick's 50). Too little and a fast pregeneration (Chunky) queues more
# than gets placed; too much and players feel the lag.
world_gen_furniture:
  # turn world-gen furniture off entirely: marker note blocks in new chunks are left as they are
  enabled: true
  # with players online
  tick_budget_ms: 5
  # with nobody online, e.g. a server pregenerating worlds overnight. At most 30: the server needs the rest of the tick
  # to save and unload the chunks being generated, or they pile up until memory runs out
  tick_budget_ms_empty: 20
