name: Build

# Compiles the plugin, runs the unit tests and builds the shaded jar on every push and pull request.
# The jar is attached to each run under "Artifacts" so a build can be tested on the dev server.
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      # caches Gradle dependencies and the Paper dev bundle between runs
      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: GardensFurniture-${{ github.sha }}
          path: build/libs/*-all.jar
          if-no-files-found: error

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ github.sha }}
          path: build/reports/tests/test/
