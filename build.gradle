plugins {
    id 'java'
    id("io.papermc.paperweight.userdev") version "2.0.0-beta.21"
    id("com.gradleup.shadow") version "9.4.2"
}

group = 'com.gardensmc'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/groups/public/"
    }
    maven {
        name = "CodeMC"
        url = uri("https://repo.codemc.io/repository/maven-public/")
    }
    maven {
        url = "https://jitpack.io/"
    }
    maven {
        url = "https://repo.dmulloy2.net/repository/public/"
    }
    maven {
        url = "https://repo.minebench.de/"
    }
    maven { url 'https://mvn.lumine.io/repository/maven-public/' }
    maven {
        name "groupez"
        url "https://repo.groupez.dev/releases"
    }
    maven {
        url "https://repo.hibiscusmc.com/releases"
    }
//    maven {
//        url "https://repo.nightexpressdev.com/releases"
//    }
    maven {
        url = uri("https://repo.opencollab.dev/main/")
    }
    maven {
        name = "prism-releases"
        url = uri("https://nexus.prism-mc.org/repository/maven-releases/")
    }
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:26.1.2.build.+")
    paperweight.paperDevBundle("26.1.2.build.+")
    // loaded at runtime by Paper via plugin.yml libraries, not shaded
    compileOnly("com.fasterxml.jackson.core:jackson-databind:2.20.0")
    // reads CustomCrafting's .conf recipes for /furniture recipe import; also a plugin.yml library
    compileOnly("com.typesafe:config:1.4.3")

    compileOnly("de.tr7zw:item-nbt-api-plugin:2.15.7")
    compileOnly("com.github.Gecolay.GSit:core:3.1.1")
    compileOnly('com.comphenix.protocol:ProtocolLib:5.3.0')
     implementation("de.themoep:inventorygui:1.6.4-SNAPSHOT")
    compileOnly("com.github.retrooper:packetevents-spigot:2.12.2")
    compileOnly 'com.ticxo.modelengine:ModelEngine:R4.0.7'
    compileOnly("com.hibiscusmc:HMCCosmetics:2.8.0-f56d5c90")
    compileOnly("com.github.GriefPrevention:GriefPrevention:16.18.4")
    // Prism (prism-mc.org) rollback/restore integration — custom actions API.
    compileOnly("org.prism_mc.prism:prism-paper-api:4.4")
    compileOnly("org.prism_mc.prism:prism-api:4.4")
    compileOnly 'org.projectlombok:lombok:1.18.36'
    annotationProcessor 'org.projectlombok:lombok:1.18.46'
//    compileOnly('org.geysermc.geyser:api:2.10.1-SNAPSHOT')
    compileOnly('org.geysermc.floodgate:api:2.2.4-SNAPSHOT')
    compileOnly(fileTree("${project.rootDir}/dependencies") { include("*.jar") })


    testCompileOnly 'org.projectlombok:lombok:1.18.46'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.46'

    // unit tests run without a server: the Paper API and NBT-API are only on the classpath, never started
    testImplementation(platform("org.junit:junit-bom:5.12.2"))
    testImplementation("org.junit.jupiter:junit-jupiter")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
    testImplementation("io.papermc.paper:paper-api:26.1.2.build.+")
    testImplementation("de.tr7zw:item-nbt-api-plugin:2.15.7")
    testImplementation("com.typesafe:config:1.4.3")
}

def targetJavaVersion = 25
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

tasks {
    build {
        dependsOn(shadowJar)
    }

    shadowJar {
        relocate("de.themoep", "com.gardensmc.furniture.shaded.inventorygui")
    }

}

test {
    useJUnitPlatform()
    testLogging {
        events "failed"
        exceptionFormat "full"
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
